name: verify

on:
  push:
    branches: [main, v2/manifest]
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: 检查清单与入口
        run: |
          set -euo pipefail
          test -f hosihikari.json
          test ! -f manifest.json
          test -f main.fsx
          test -f helper.fsx
          test -f MyFSharpPlugin.conf
          node -e "const m=JSON.parse(require('fs').readFileSync('hosihikari.json','utf8')); if(m.kind!=='plugin') throw new Error('kind'); if(m.apiVersion!==3) throw new Error('apiVersion'); if(m.loader!=='fsharp') throw new Error('loader'); if(m.entry!=='main.fsx') throw new Error('entry'); if(!m.dependencies?.some(d=>d.name==='hosihikari-fsharp')) throw new Error('dependencies');"

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 用契约编译源码
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/compile-check"
          mkdir -p "$check"
          # #load 由 F# 加载器处理；普通 fsproj 里改成两个编译单元。
          cp helper.fsx "$check/helper.fs"
          { echo "module TemplateCheck"; sed -E 's/^[[:space:]]*#load.*$//' main.fsx; } > "$check/main.fs"
          cat > "$check/Check.fsproj" <<XML
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Library</OutputType>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="helper.fs" />
              <Compile Include="main.fs" />
              <PackageReference Include="Hosihikari.Plugin.Abstractions" Version="3.0.0" />
              <PackageReference Include="Microsoft.Extensions.Logging.Abstractions" Version="10.0.15" />
            </ItemGroup>
          </Project>
          XML
          dotnet build "$check/Check.fsproj" -c Release --nologo
